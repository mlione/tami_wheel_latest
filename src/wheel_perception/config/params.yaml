/**:
  ros__parameters:
    # ==========================
    # 1. AI 模型配置
    # ==========================mmseg_modelb5.engine
    ai:
      engine_path: "/home/x/tami/wheel_latest/src/wheel_perception/config/combined5.engine"
      # engine_path: "src/wheel_perception/config/mmseg_modelb2.engine"
      # engine_path: "src/wheel_perception/config/sealackcityb2.engine"
    # ==========================
    # 2. ZED 相机驱动配置
    # ==========================
    zed:
      resolution_id: 2      # 0=2K, 1=1080, 2=720, 3=VGA
      fps: 60               # 帧率
      depth_min: 0.3        # 最小深度 (米)
      depth_max: 10.0        # 最大感测距离
      flip_camera: false    # 是否倒装
      depth_mode: 1         # 1=PERFORMANCE (快), 3=NEURAL (准)
      coordinate_system: 3  # 3=RIGHT_HANDED_Z_UP_X_FWD (ROS标准坐标系: X前, Y左, Z上)
      svo_path: ""          # 如果要回放SVO录像，填路径，否则留空
      use_dataset_mode: true #用数据集模式 (从SVO或ROS话题读取数据，而非直接访问相机)
      odometry:
        enabled: true             # 实车模式：用同一 ZED grab 的 WORLD 绝对位姿差分生成 /odom
        odom_frame: odom
        base_frame: base_link
        velocity_filter_alpha: 0.5 # 世界位姿差分速度的 EMA；越小越平滑，但延迟越大
        velocity_min_dt: 0.005     # 小于该图像时间差的数据不参与速度差分
        velocity_max_dt: 0.2       # 跟踪中断/卡帧超过该时间时不发布该次速度
        linear_velocity_stddev: 0.20  # /odom.twist 线速度标准差，仅用于协方差
        angular_velocity_stddev: 0.25 # /odom.twist 角速度标准差，仅用于协方差
        publish_sdk_twist_diagnostic: true # 原始 SDK Twist 只发布诊断，不参与控制
        # base_link 坐标系：X向前、Y向左、Z向上，角度单位为 rad。
        # 实际安装为“右0.2m、前0.2m”，所以 Y 必须填 -0.2。
        extrinsic:
          translation_x: 0.45
          translation_y: -0.2
          translation_z: 0.0
          roll: 0.0
          pitch: 0.0
          yaw: 0.0

    # ==========================
    # 3. 感知核心参数
    # ==========================
    perception:
      # --- 感知区域 (ROI) ---
      # 注意：这层过滤发生在点云转换到轮椅中心 (base_link) 之前，
      # 所以下列范围使用相机坐标系：X向前、Y向左、Z向上。
      # 当前相机相对轮椅中心位于前方 0.45 m、右侧 0.20 m，
      # 因此将相机 ROI 设为非对称范围，使转换后约对应 base_link 的 Y=[-1.5, 1.5] m。
      roi:
        min_x: 0.3          # 相机前方盲区；受可见距离限制，无法覆盖 base_link 前方 0.3 m 内的全部区域
        max_x: 4.6          # 相机坐标；转换后约对应 base_link 前方 5.0 m
        min_y: -1.3         # 相机右侧；转换后约对应 base_link Y=-1.5 m
        max_y: 1.7          # 相机左侧；转换后约对应 base_link Y=+1.5 m
        min_z: -0.2         # 地面过滤 (去除地面点)
        max_z: 2.0          # 高度上限

      # --- 性能优化 ---
      sample_step: 2        # 降采样 (2表示每隔1个点取1个，减少计算量)
      voxel_size: 0.1      # [新增] 体素网格大小 (0.05 = 5cm)
      road_fit:
        # 道路边界方向统一为朝 +X；超出此范围时保持上一可信拟合。
        max_abs_yaw: 0.7   # rad，约 40 度

      # --- 几何避障逻辑 (椭圆方程) ---
      # 判据: ellipse_x * x^2 + ellipse_y * y^2 < thres
      obstacle:
        ellipse_x: 6.0      # 对应旧代码 6.0
        ellipse_y: 225.0    # 对应旧代码 225.0 (hpp默认是100，这里强制改为225以复刻旧效果)
        thres: 50.0         # 阈值

    # === LQR 轨迹跟踪参数 ===
    lqr:
      # 权重矩阵 Q 的对角线元素
      q_pos: 10.0  # 位置误差权重 (q_dist -> q_pos)
      q_ang: 10.0  # 角度误差权重 (q_yaw -> q_ang)
      q_integral: 0.2      # 距离误差积分权重，用于消除斜坡/偏置造成的稳态误差
      integral_limit: 1.5  # 积分限幅，防止长时间偏差后转向过冲
      
      # 模型参数
      k_w: 10.0    # 对应 B 矩阵的增益
      model_v: 0.5 # [关键] 内部模型速度 (旧代码写死为 0.5)
      
      # 目标设定
      aim_dist: 0.8 # 目标离墙距离 (米)，让车不要贴墙太近
      lookahead_time: 0.5 # LQR 跟踪 DWA 轨迹的前视时间 (秒)
      max_dwa_tracking_correction: 0.15 # DWA模式：LQR相对参考角速度的最大修正量 (rad/s)
      max_cruise_angular_velocity: 0.30 # 巡线模式：LQR角速度上限 (rad/s)，仍受后续加速度和硬件约束

    # === DWA 局部规划参数（与现有 ROS YAML 参数系统共用）===
    dwa:
      max_velocity: 1.0                 # m/s
      min_velocity: 0.0                 # 载人设备默认禁止倒车
      max_angular_velocity: 1.0         # rad/s，DWA 内部物理角速度
      max_acceleration: 1.0             # m/s^2
      max_angular_acceleration: 1.5     # rad/s^2
      prediction_time: 2.5              # 秒；ROS 2 参数声明为 double，必须保留小数点
      simulation_time_step: 0.1         # 轨迹积分步长
      velocity_resolution: 0.1          # m/s
      angular_resolution: 0.05          # rad/s，细化转向候选，减少角速度跳档

      weight_heading: 1.0
      weight_obstacle: 3.5
      weight_velocity: 4.0             # 提高前进收益，避免长期选择有效的静止轨迹
      weight_road: 1.0
      # 平滑总代价缩放。各子项已按执行器能力归一化，不宜设得过大。
      weight_smooth: 0.02              # 保留平滑约束，同时减小对正常加速的抑制
      smooth:
        weight_delta_v: 1.5              # |v(k)-v(k-1)|
        weight_delta_w: 2.0              # |w(k)-w(k-1)|，优先抑制左右摆动
        weight_acceleration: 0.8          # |a(k)|
        weight_angular_acceleration: 1.0  # |alpha(k)|
        weight_jerk: 0.0              # |a(k)-a(k-1)| / dt
        weight_angular_jerk: 0.0       # |alpha(k)-alpha(k-1)| / dt
        max_jerk: 2.0                     # m/s^3，仅作归一化；急停不受舒适项阻挡
        max_angular_jerk: 3.0             # rad/s^3，仅作归一化

      # 允许低速滚动转弯；仅在 v 近似为零时强制 w=0，继续禁止原地转向。
      minimum_turning_velocity: 0.001
      # 最小转弯半径约束：所有滚动轨迹满足 |v/w| >= 该值，避免低速急转。
      minimum_turning_radius: 0.1

      # 无近距离障碍时使用确定性道路巡线轨迹；障碍进入该区域后才激活DWA。
      cruise_velocity: 0.6               # 无障碍巡线目标速度，仍受加速度限制
      activation:
        max_x: 5.0                        # 前方激活距离
        min_y: -1.0                       # 右侧激活边界
        max_y: 1.0                        # 左侧激活边界
        minimum_points: 20                 # 区域内达到该点数即激活
        clear_frames: 5                   # 连续无障碍帧数达到该值才退出DWA

      # 上一条轨迹仍安全、且新轨迹优势不明显时保持原轨迹，避免候选来回切换。
      trajectory_hold:
        enabled: true
        score_switch_margin: 0.10       # 小幅速度收益即可离开旧的静止轨迹
        relative_switch_margin: 0.01 # 新轨迹净空改善超过 1% 才切换
        minimum_clearance: 0.30          # 仅在上一轨迹净空充足时保持
        clearance_switch_margin: 0.10   # 新轨迹净空明显改善时及时切换
      # 仅当存在满足 BLE 可执行域、全程安全、比同速度直行净空更大的滚动转弯轨迹时，
      # 才相对提高停车和其他非改善轨迹的代价；近距离急停优先级不变。
      stop_preference:
        enabled: true
        penalty: 6.0                     # 有限评分差，避免无条件强制运动
        minimum_moving_clearance: 0.10   # m，扣除 robot_radius 后的全程最小净空
        minimum_clearance_gain: 0.05     # m，转弯轨迹最小净空相对同速度直行的最小优势


      obstacle_distance_threshold: 5.0  # 只评价此前向距离内的障碍点
      robot_radius: 0.45                 # 含乘员/轮椅外廓的碰撞半径
      road_margin: 0.15                  # 车体半径之外的额外道路边界安全裕量
      # 与 ble_hardware_bridge 一致的保守可执行域。(0,0) 始终是合法停车指令；
      # 非零运动必须跨过遥感死区，并满足当前挡位的角速度能力。
      hardware_constraints:
        enabled: true
        minimum_moving_velocity: 0.15
        gear_0001_threshold: 0.35
        gear_0003_threshold: 0.70
        gear_0001_max_angular: 0.30
        gear_0003_max_angular: 0.60
        gear_0005_max_angular: 0.90
      max_obstacle_points: 2500          # CPU DWA 点云上限，保持实时性
      # DWA 是二维底盘规划器，只投影该矩形和高度带内的点。
      # /zed/point_cloud 仍保留完整调试点云；/dwa/obstacle_cloud 显示实际规划输入。
      obstacle_roi:
        min_x: 0.3                       # 忽略车体后方及相机近端噪声
        max_x: 5.0                       # 与局部障碍评价距离一致
        min_y: -1.5                      # 右侧局部规划范围
        max_y: 1.5                       # 左侧局部规划范围
        min_z: -0.2                      # 轮椅碰撞体最低有效高度（相机坐标系）
        max_z: 1.0                       # 排除树冠等高处点；实车需按相机安装高度标定
      visualization:
        max_candidates: 100
      # 室内 DWA 单独测试；正常部署保持 off。visualize 只输出轨迹，
      # 始终向 /cmd_vel 发零速度；drive 必须通过 launch 显式解锁。
      indoor_test:
        mode: "off"                # off | visualize | drive
        allow_motion: false        # drive 模式的第二道人工解锁
        max_velocity: 0.30         # drive 线速度硬上限 (m/s)
        preview_velocity: 0.30     # visualize 假设的当前速度，不是实测速度

    # === 最终安全层：优先级高于 DWA 与 LQR ===
    safety:
      emergency_stop_distance: 0.5     # m，进入融合危险区立即置零
      perception_timeout: 0.5            # s，感知中断时主动发布停车
      stop_on_no_path: true              # 无安全轨迹时停车而非沿用旧指令

    # 实车优先使用 /odom.twist；数据集模式仍固定使用本轮回放的上一控制输出。
    velocity_feedback:
      timeout: 0.3
      stop_on_timeout: false       # 初期回退到上一输出；实车验证后可改 true
      accept_zero_twist: true      # 真实停车 v=0,w=0 也是有效反馈

    # === 动态右侧目标距离 ===
    dynamic_aim:
      enabled: true          # 是否启用动态右侧目标距离
      ratio: 0.35          # target_right_distance = road_width * ratio
      min_dist: 0.60       # 窄路时最小右侧安全距离
      max_dist: 1.0        # 宽路时仍限制靠右，不继续向道路中心移动
      fallback_dist: 1.0   # 左侧边界长期不可用时的回退目标距离
      min_width: 1.0       # 合法道路宽度下限
      max_width: 15.0       # 合法道路宽度上限，覆盖约 6 米的宽路场景
      max_target_step: 0.05 # 每帧目标距离最大变化，抑制控制跳变
      hold_frames: 10      # 左侧短时失效时保持上一可信目标的帧数

    # === 逻辑状态机参数 ===
    logic:
      base_vel: 1.0      # 正常巡线速度 (m/s)
      stop_dist: 0.5     # 紧急停车距离 (m)
      
      pass_clearance: 0.1 # 历史兼容参数；当前 DWA 控制链未使用
